name: Maven Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: JDK 25 einrichten
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Mit Maven bauen
        run: mvn -B package --file AHShop/pom.xml

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: AHShop
          path: AHShop/target/AHShop.jar
